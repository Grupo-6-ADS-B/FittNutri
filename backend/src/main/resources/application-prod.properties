# ==========================================
# PERFIL PROD - rodando na EC2
# ==========================================

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/fittnutri?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Flyway — migrações versionadas em produção
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Logs - apenas erros em producao
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}

# AWS S3
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# Criptografia de dados sensíveis (CPF) — obrigatório em produção
# Gere com: openssl rand -base64 48
app.aes-key=${APP_AES_KEY}

# Segurança — desabilitar ferramentas de desenvolvimento em produção
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
