# ==========================================
# PERFIL PROD - rodando na EC2
# ==========================================

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/fittnutri?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# data.sql é idempotente: INSERT IGNORE + UPDATE WHERE fonte IS NULL
# Pode rodar em todo restart — só afeta registros ainda não normalizados
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logs - apenas erros em producao
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}

# AWS S3 — credenciais via IAM Instance Profile (sem chaves explicitas)
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# Resend — email transacional
resend.api-key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:FittNutri <no-reply@fittnutri.site>}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}

# Criptografia de dados sensíveis (CPF) — obrigatório em produção
# Gere com: openssl rand -base64 48
app.aes-key=${APP_AES_KEY}

# Segurança — desabilitar ferramentas de desenvolvimento em produção
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=fittnutri
