spring.application.name=demo

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Erros
server.error.include-binding-errors=always
server.error.include-message=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.info.title=FittNutri API
springdoc.info.description=Documentacao da API FittNutri
springdoc.info.version=1.0.0

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/fittnutri     ?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto Hibernate para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.profiles.active=dev

# JWT
jwt.validity=${JWT_VALIDITY:3600000}
jwt.secret=${JWT_SECRET:local-secret-key-for-development-only}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}
