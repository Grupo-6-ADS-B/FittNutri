spring.application.name=demo

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/fittnutri?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Logs - apenas erros em producao
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# Erros
server.error.include-binding-errors=always
server.error.include-message=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.info.title=FittNutri API
springdoc.info.description=Documentacao da API FittNutri
springdoc.info.version=1.0.0

# JWT
jwt.validity=${JWT_VALIDITY:3600000}
jwt.secret=${JWT_SECRET}

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}

# AWS S3
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
