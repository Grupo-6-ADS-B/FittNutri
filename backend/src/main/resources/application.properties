spring.application.name=demo

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:fittnutri
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Erros
server.error.include-binding-errors=always
server.error.include-message=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.info.title=FittNutri API
springdoc.info.description=Documentacao da API FittNutri
springdoc.info.version=1.0.0

# JWT
jwt.validity=${JWT_VALIDITY:3600000}
jwt.secret=${JWT_SECRET:local-secret-key-for-development-only}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}
