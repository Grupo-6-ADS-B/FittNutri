spring.application.name=demo

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Erros — não expor detalhes internos ao cliente
server.error.include-binding-errors=never
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.info.title=FittNutri API
springdoc.info.description=Documentacao da API FittNutri
springdoc.info.version=1.0.0

 # ✅ CORRIGIDO: Removidos espaços da URL do banco.
 # 💡 SUGESTÃO OWASP A05: Mover credenciais para .env:
 # spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
 # spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/fittnutri?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto Hibernate para MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.profiles.active=dev

# JWT
jwt.validity=${JWT_VALIDITY:3600000}
jwt.secret=${JWT_SECRET:local-secret-key-for-development-only}

# Criptografia de dados sensíveis (CPF)
# NUNCA use este valor padrão em produção — defina APP_AES_KEY no ambiente
app.aes-key=${APP_AES_KEY:dev-aes-key-insecure-change-in-prod}

# Migração de CPFs para criptografia — defina true APENAS para rodar a migração
# Após migrar, volte para false antes de reiniciar
app.run-cpf-migration=${APP_RUN_CPF_MIGRATION:false}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Resend — email transacional
resend.api-key=${RESEND_API_KEY:re_dev_placeholder_nao_envia}
email.from=${EMAIL_FROM:FittNutri <no-reply@fittnutri.site>}

# Email de destino para notificações de contato
email.contact=${EMAIL_CONTACT:suporte.fittnutri@gmail.com}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:654251176082-2bbn9dp6vhee4o2efkmc8t73q8ga8t7g.apps.googleusercontent.com}
