# ==========================================
# PERFIL DEV — ambiente de desenvolvimento local via Docker
# ==========================================
# Este perfil é ativado pelo docker-compose.dev.yml via SPRING_PROFILES_ACTIVE=dev
#
# O que está DESABILITADO em dev (beans @Profile("prod")):
#   - S3Config / S3Service       → sem uploads para AWS S3
#   - PdfConsumerService         → sem consumidor RabbitMQ
#   - PdfProducerService         → sem produtor RabbitMQ
# ==========================================

# MySQL — usa a URL injetada pelo docker-compose.dev.yml (mysql:3306)
# Fallback aponta para localhost para quem roda sem Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fittnutri?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logs — verbose para facilitar debug local
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.fitt_nutri=DEBUG

# Actuator — expor endpoints para inspeção local
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=fittnutri

# Swagger — habilitado em dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
