# ============================================================
# Properties exclusivas para execução de testes (CI e local)
# Sobrescreve application.properties principal durante mvn test
# ============================================================

# RC2 FIX: profile "test" impede que application-dev.properties
# seja carregado, evitando que o datasource MySQL sobrescreva o H2
spring.profiles.active=test

# H2 em memória — sem dependência de MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — H2 cria o schema automaticamente
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Desabilitar inicialização de data.sql nos testes
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT — valor fixo para testes (não depende de secret do ambiente)
jwt.secret=test-secret-key-for-ci-only-minimum-32-characters-long
jwt.validity=3600000

# AES — valor fixo para testes
app.aes-key=dGVzdC1hZXMta2V5LTMyY2hhcnMhISEhISE=

# Desabilitar migração de CPF nos testes
app.run-cpf-migration=false

# RC3 FIX: sintaxe de linha única (backslash-continuation é frágil em .properties)
# RC1 complemento: mesmo com @Profile("prod") no RabbitMQConfig, excluímos
# o auto-configure do broker para garantir que nenhuma ConnectionFactory seja criada
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Frontend URL
frontend.url=http://localhost:5173

# Resend — placeholder para testes (não envia email de verdade)
resend.api-key=re_test_placeholder_nao_envia
email.from=FittNutri <no-reply@fittnutri.site>

# Google OAuth — client ID de teste
google.client-id=test-google-client-id-for-ci

# Groq — placeholder para testes (não chama IA de verdade)
groq.api-key=gsk_test_placeholder_nao_chama
groq.model=openai/gpt-oss-120b

# Actuator
management.endpoints.web.exposure.include=health
