# =============================================================================
# FittNutri — CI/CD Pipeline
# =============================================================================
# Jobs:
#   1. backend-ci  → testa, escaneia segurança e constrói imagem Docker
#   2. frontend-ci → instala dependências, faz build e constrói imagem Docker
#   3. deploy      → (apenas nas branches main e claude-test) faz deploy no EC2
# =============================================================================

name: FittNutri CI/CD

on:
  push:
    branches: [ main, dev, claude-test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Branch alvo do deploy manual'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - claude-test

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/fittnutri-backend
  IMAGE_FRONTEND: ${{ github.repository_owner }}/fittnutri-frontend

# ==============================================================================
# JOB 1 — BACKEND CI
# Stack: Java 21 · Spring Boot 3.5.5 · Maven · JaCoCo · OWASP Dependency-Check
# ==============================================================================
jobs:
  backend-ci:
    name: Backend — Test, Security Scan & Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4

      # ── 2. Configurar Java 21 (Temurin) ──────────────────────────────────────
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── 3. Compilar e executar testes com JaCoCo ─────────────────────────────
      # O profile "local" usa H2 em memória — não precisa de MySQL no CI
      - name: Executar testes com cobertura JaCoCo
        run: |
          mvn -B clean verify \
            -Dspring.profiles.active=local \
            -DJWT_SECRET=${{ secrets.JWT_SECRET }} \
            -Dmaven.test.failure.ignore=false
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # ── 4. Publicar relatório JaCoCo como artefato ───────────────────────────
      - name: Publicar relatório de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      # ── 5. OWASP Dependency-Check — CVEs ≥ 7.0 quebram o build ──────────────
      # failOnError=false: tolera falha de rede/NVD sem derrubar o build;
      # failBuildOnCVSS=7: ainda bloqueia se CVE real for encontrado.
      - name: OWASP Dependency-Check (CVSS ≥ 7)
        run: |
          mvn -B dependency-check:check \
            -DnvdApiKey="${{ secrets.NVD_API_KEY }}" \
            -DfailBuildOnCVSS=7 \
            -DskipTestScope=true \
            -DfailOnError=false
        continue-on-error: true   # NVD API tem instabilidades; CVEs críticos aparecem no relatório

      - name: Publicar relatório OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: backend/target/dependency-check-report.*
          retention-days: 14

      # ── 6. Build da imagem Docker (backend) ──────────────────────────────────
      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata da imagem (tags & labels)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem Docker (backend)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude-test') }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 2 — FRONTEND CI
  # Stack: Node 20 · React 19 · Vite · ESLint
  # ============================================================================
  frontend-ci:
    name: Frontend — Build & Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4

      # ── 2. Configurar Node.js 20 ─────────────────────────────────────────────
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Instalar dependências ──────────────────────────────────────────────
      - name: Instalar dependências (npm ci)
        run: npm ci

      # ── 4. Verificar qualidade de código (ESLint) ─────────────────────────────
      - name: Lint — ESLint
        run: npm run lint
        continue-on-error: false

      # ── 5. Build de produção (Vite) ───────────────────────────────────────────
      - name: Build de produção (Vite)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=1024'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL }}

      # ── 6. Verificar integridade dos assets gerados ────────────────────────────
      - name: Verificar assets de saída
        run: |
          echo "Conteúdo do diretório dist:"
          ls -lh dist/
          test -f dist/index.html || (echo "ERRO: index.html não encontrado em dist/" && exit 1)
          echo "Build verificado com sucesso."

      # ── 7. Publicar artefato do build ─────────────────────────────────────────
      - name: Publicar artefato do build (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

      # ── 8. Auditoria de segurança npm ─────────────────────────────────────────
      - name: Auditoria de segurança (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true    # avisos não bloqueiam; apenas registra

      # ── 9. Build e push da imagem Docker (frontend) ───────────────────────────
      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata da imagem (tags & labels)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem Docker (frontend)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude-test') }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 3 — DEPLOY (apenas na branch main, após CI aprovado)
  # Estratégia: SSH no EC2 → docker pull → docker-compose up
  # ============================================================================
  deploy:
    name: Deploy — AWS EC2 (produção)
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude-test')) ||
      github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      # ── 1. Checkout (necessário para docker-compose.yml) ─────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4

      # ── 2. Configurar credenciais AWS ─────────────────────────────────────────
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 3. Deploy via SSH no EC2 ──────────────────────────────────────────────
      - name: Deploy via SSH no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Autenticando no GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Atualizando código..."
            cd /home/${{ secrets.EC2_USER }}/fittnutri
            git pull origin main

            echo "==> Baixando imagens mais recentes..."
            docker pull ghcr.io/${{ env.IMAGE_BACKEND }}:latest
            docker pull ghcr.io/${{ env.IMAGE_FRONTEND }}:latest

            echo "==> Recriando os containers com zero-downtime..."
            docker compose up -d --remove-orphans

            echo "==> Removendo imagens antigas..."
            docker image prune -f

            echo "==> Deploy concluído com sucesso."

      # ── 4. Health-check pós-deploy ────────────────────────────────────────────
      - name: Health-check — Backend /actuator/health
        run: |
          echo "Aguardando 30s para o backend inicializar..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ secrets.EC2_HOST }}:8080/actuator/health" \
            --max-time 15 || echo "000")
          echo "Status HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: Backend não respondeu com 200. Status: $HTTP_STATUS"
            exit 1
          fi
          echo "Health-check aprovado."
